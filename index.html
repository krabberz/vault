<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[the vault]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #050608;
            --panel-bg: #0d1117;
            --panel-border: #2a323d;
            --silver-main: #c0c6ce;
            --silver-bright: #e2e8f0;
            --silver-dim: #64748b;
            --cyan-accent: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.25);
            --amber-accent: #ff9900;
            --amber-glow: rgba(255, 153, 0, 0.25);
            --danger-red: #ff3366;
            --font-head: 'Chakra Petch', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-void);
            color: var(--silver-main);
            font-family: var(--font-mono);
            padding: 2.5rem;
            max-width: 1100px;
            margin: 0 auto;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        body.larry-tint {
            background-color: #040d07;
            background-image: 
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
        }

        body.larry-tint::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 255, 102, 0.025);
            pointer-events: none;
            z-index: 9998;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--panel-border);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 120px;
            height: 2px;
            background: var(--cyan-accent);
            box-shadow: 0 0 10px var(--cyan-accent);
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }

        h1 {
            font-family: var(--font-head);
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: var(--silver-bright);
            text-transform: uppercase;
        }

        .user-tag {
            font-size: 0.75rem;
            color: var(--cyan-accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid var(--cyan-accent);
            padding: 0.2rem 0.6rem;
            background: rgba(0, 240, 255, 0.05);
        }

        .header-actions {
            display: flex;
            gap: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: var(--silver-bright);
            border: 1px solid var(--silver-dim);
            padding: 0.6rem 1.4rem;
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .btn:hover {
            border-color: var(--cyan-accent);
            color: var(--cyan-accent);
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .btn-cyan {
            border-color: var(--cyan-accent);
            color: var(--cyan-accent);
        }

        .btn-amber {
            border-color: var(--amber-accent);
            color: var(--amber-accent);
        }

        .btn-amber:hover {
            background: rgba(255, 153, 0, 0.1);
            border-color: var(--amber-accent);
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 153, 0, 0.3);
        }

        .btn-danger {
            border-color: var(--danger-red);
            color: var(--danger-red);
        }

        .btn-danger:hover {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--danger-red);
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.3);
        }

        .upload-section {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: none;
        }

        .upload-section.active { display: block; }

        .form-row {
            display: flex;
            gap: 1.2rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--silver-dim);
            text-transform: uppercase;
        }

        input[type="text"], input[type="password"], input[type="file"], input[type="date"], select, textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-void);
            border: 1px solid var(--panel-border);
            color: var(--silver-bright);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }

        input[type="text"]:focus, input[type="password"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
            border-color: var(--cyan-accent);
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--panel-border);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
        }

        .tab {
            padding: 0.6rem 1.2rem;
            background: transparent;
            border: none;
            color: var(--silver-dim);
            font-family: var(--font-head);
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover { color: var(--silver-bright); }

        .tab.active {
            color: var(--cyan-accent);
            border-bottom-color: var(--cyan-accent);
            background: rgba(0, 240, 255, 0.03);
        }

        .sort-wrapper {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding-bottom: 0.4rem;
        }

        .sort-wrapper label {
            margin-bottom: 0;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        .sort-select {
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            width: auto;
            border-color: var(--panel-border);
        }

        .track-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .track-grid {
                grid-template-columns: 1fr;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .controls {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        .track-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            justify-content: space-between;
        }

        .cover-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            background: var(--bg-void);
            position: relative;
        }

        .track-cover {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .track-cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--silver-dim);
            font-size: 0.8rem;
            letter-spacing: 2px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.03) 0%, rgba(5, 6, 8, 1) 100%);
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            width: 100%;
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.8rem;
        }

        .track-title {
            font-family: var(--font-head);
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--silver-bright);
            letter-spacing: 0.5px;
            word-break: break-word;
        }

        .track-date {
            font-size: 0.7rem;
            color: var(--cyan-accent);
            letter-spacing: 1px;
            margin-top: -0.2rem;
        }

        .track-notes {
            font-size: 0.75rem;
            color: var(--silver-main);
            background: rgba(5, 6, 8, 0.6);
            border-left: 2px solid var(--panel-border);
            padding: 0.5rem 0.75rem;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.6rem;
            font-family: var(--font-mono);
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .badge-private {
            border-color: var(--amber-accent);
            color: var(--amber-accent);
            background: rgba(255, 153, 0, 0.05);
            box-shadow: 0 0 6px var(--amber-glow);
        }

        .badge-public {
            border-color: var(--cyan-accent);
            color: var(--cyan-accent);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 6px var(--cyan-glow);
        }

        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .badge-private .status-indicator { background: var(--amber-accent); }
        .badge-public .status-indicator { background: var(--cyan-accent); }

        audio {
            width: 100%;
            height: 32px;
            margin-top: 0.2rem;
            filter: invert(0.9) hue-rotate(180deg);
        }

        .track-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.2rem;
        }

        .track-actions .btn {
            flex: 1;
            padding: 0.4rem 0.6rem;
            font-size: 0.75rem;
            text-align: center;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            border: 1px dashed var(--panel-border);
            color: var(--silver-dim);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 6, 8, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-family: var(--font-head);
            font-size: 1.2rem;
            color: var(--silver-bright);
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        .error-msg {
            color: var(--danger-red);
            font-size: 0.75rem;
            margin-top: 0.5rem;
            display: none;
        }

        .file-hint {
            font-size: 0.7rem;
            color: var(--silver-dim);
            margin-top: 0.3rem;
        }

        #larry-bouncer {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 240px;
            z-index: 9999;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            border: 2px solid var(--cyan-accent);
            background: #000;
        }

        #larry-bouncer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>// vault //</h1>
            <span id="userTag" class="user-tag">// guest //</span>
        </div>
        <div class="header-actions">
            <button id="addTrackBtn" class="btn btn-cyan" onclick="toggleUploadDrawer()" style="display: none;">+ add track</button>
            <button id="authBtn" class="btn" onclick="handleAuthAction()">// login //</button>
        </div>
    </header>

    <section id="uploadDrawer" class="upload-section">
        <form id="trackForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="title">// track title // identifier //</label>
                    <input type="text" id="title" placeholder="e.g., UNIT_02_AUDIO_DEMO" required>
                </div>
                <div class="form-group">
                    <label for="trackDate">// creation date (optional) //</label>
                    <input type="date" id="trackDate">
                </div>
            </div>
            <div class="form-group">
                <label for="audioFile">// audio file //</label>
                <input type="file" id="audioFile" accept="audio/*" required>
            </div>
            <div class="form-group">
                <label for="imageFile">// cover image (optional) //</label>
                <input type="file" id="imageFile" accept="image/*">
            </div>
            <div class="form-group">
                <label for="trackNotes">// notes // production log (optional) //</label>
                <textarea id="trackNotes" placeholder="e.g., BPM: 128 | DAW: Ableton | Key: Bm"></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.8rem;">
                <button type="button" class="btn" onclick="toggleUploadDrawer()">// cancel //</button>
                <button type="submit" class="btn btn-cyan">// upload //</button>
            </div>
        </form>
    </section>

    <div class="controls">
        <div class="tabs">
            <button id="tab-all" class="tab active" onclick="setFilter('all')">// all // (<span id="count-all">0</span>)</button>
            <button id="tab-public" class="tab" onclick="setFilter('public')">// public // (<span id="count-public">0</span>)</button>
            <button id="tab-private" class="tab" onclick="setFilter('private')" style="display: none;">// private // (<span id="count-private">0</span>)</button>
        </div>
        <div class="sort-wrapper">
            <label for="sortSelect">// sort by //</label>
            <select id="sortSelect" class="sort-select" onchange="setSort(this.value)">
                <option value="date-desc">Date (Newest First)</option>
                <option value="date-asc">Date (Oldest First)</option>
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
            </select>
        </div>
    </div>

    <main id="trackList" class="track-grid">
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal">
            <h2 class="modal-title">// AUTHENTICATE //</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">// identifier //</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">// access key //</label>
                    <input type="password" id="password" required>
                </div>
                <div id="loginError" class="error-msg">// ACCESS DENIED //</div>
                <div style="display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" onclick="closeLoginModal()">// cancel //</button>
                    <button type="submit" class="btn btn-cyan">// verify //</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Track Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <h2 class="modal-title">// EDIT TRACK ENTRY //</h2>
            <form id="editForm">
                <input type="hidden" id="editTrackId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editTitle">// title //</label>
                        <input type="text" id="editTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="editTrackDate">// date //</label>
                        <input type="date" id="editTrackDate">
                    </div>
                </div>
                <div class="form-group">
                    <label for="editAudioFile">// replace audio (optional) //</label>
                    <input type="file" id="editAudioFile" accept="audio/*">
                    <div class="file-hint">// leave empty to keep current audio file //</div>
                </div>
                <div class="form-group">
                    <label for="editImageFile">// replace artwork (optional) //</label>
                    <input type="file" id="editImageFile" accept="image/*">
                    <div class="file-hint">// leave empty to keep current artwork //</div>
                </div>
                <div class="form-group">
                    <label for="editNotes">// notes // production log //</label>
                    <textarea id="editNotes"></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" onclick="closeEditModal()">// cancel //</button>
                    <button type="submit" class="btn btn-amber">// save changes //</button>
                </div>
            </form>
        </div>
    </div>

    const CREDENTIALS = {
        admin: {
            userHash: "4c3b3284e206c3db72440736cfdbd185f0e61a3c7fd9f049987196b987d3d1ee",
            passHash: "4107288f0b60f2a3cad009e8164af48d39ba6855a3388e5e6858364e14c2fdff"
        },
        guest1: {
            userHash: "082e7e546a5b545fd2316e9520afd61b65d5d0a72275763a4820e4906af18aa6",
            passHash: "cb45aae0c5e7f85ff9b17094879fd91d1445ae34aebb75f785a7f3280237d44f"
        },
        guest2: {
            userHash: "7afbf4c2b94e17a139b0a73d3752526219ada3fc79293926c9a916eeb0a82f62",
            passHash: "eff0c9dc518a3e8a4a1adec61f0d1abd0240263d1741145ec1e489cf9a6bca96"
        },
    };

    let activeFilter = 'all';
    let activeSort = 'date-desc';
    let currentUser = sessionStorage.getItem('vault_auth_user') || null;
    let isLoggedIn = currentUser !== null;

    // Initialize UI on page load
    window.addEventListener('DOMContentLoaded', () => {
        updateAuthStateUI();
        loadAndRender();
        checkLarryEasterEgg();
    });

    function checkLarryEasterEgg() {
        const roll = Math.floor(Math.random() * 100);
        if (roll === 0) {
            document.body.classList.add('larry-tint');
            initLarryBouncer();
        }
    }

    function initLarryBouncer() {
        const larry = document.createElement('div');
        larry.id = 'larry-bouncer';
        
        const img = document.createElement('img');
        img.src = 'larry.gif';
        img.alt = 'Larry';
        img.onerror = () => {
            larry.style.display = 'flex';
            larry.style.alignItems = 'center';
            larry.style.justifyContent = 'center';
            larry.style.color = '#00ff66';
            larry.style.fontFamily = 'var(--font-head)';
            larry.textContent = '// LARRY.GIF //';
        };

        larry.appendChild(img);
        document.body.appendChild(larry);

        const width = 320;
        const height = 240;
        let posX = Math.random() * (window.innerWidth - width);
        let posY = Math.random() * (window.innerHeight - height);
        let vx = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 1.5);
        let vy = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 1.5);

        const colors = ['#00ff66', '#00f0ff', '#ff9900', '#ff3366', '#cc00ff', '#ffff00'];

        function changeBorderColor() {
            const nextColor = colors[Math.floor(Math.random() * colors.length)];
            larry.style.borderColor = nextColor;
        }

        function animate() {
            const maxX = window.innerWidth - width;
            const maxY = window.innerHeight - height;

            posX += vx;
            posY += vy;

            let hit = false;

            if (posX <= 0) {
                posX = 0;
                vx *= -1;
                hit = true;
            } else if (posX >= maxX) {
                posX = maxX;
                vx *= -1;
                hit = true;
            }

            if (posY <= 0) {
                posY = 0;
                vy *= -1;
                hit = true;
            } else if (posY >= maxY) {
                posY = maxY;
                vy *= -1;
                hit = true;
            }

            if (hit) {
                changeBorderColor();
            }

            larry.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            posX = Math.min(posX, window.innerWidth - width);
            posY = Math.min(posY, window.innerHeight - height);
        });

        requestAnimationFrame(animate);
    }

    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function updateAuthStateUI() {
        const userTag = document.getElementById('userTag');
        const authBtn = document.getElementById('authBtn');
        const privateTab = document.getElementById('tab-private');

        if (isLoggedIn) {
            userTag.textContent = `// user: ${currentUser} //`;
            authBtn.textContent = "// logout //";
            privateTab.style.display = "block";
        } else {
            userTag.textContent = "// guest //";
            authBtn.textContent = "// login //";
            privateTab.style.display = "none";
            if (activeFilter === 'private') {
                setFilter('all');
            }
        }
    }

    function handleAuthAction() {
        if (isLoggedIn) {
            sessionStorage.removeItem('vault_auth_user');
            currentUser = null;
            isLoggedIn = false;
            updateAuthStateUI();
            loadAndRender();
        } else {
            document.getElementById('loginModal').classList.add('active');
        }
    }

    function closeLoginModal() {
        document.getElementById('loginModal').classList.remove('active');
        document.getElementById('loginForm').reset();
        document.getElementById('loginError').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const userVal = document.getElementById('username').value;
        const passVal = document.getElementById('password').value;

        const userHashed = await sha256(userVal);
        const passHashed = await sha256(passVal);

        const matchedEntry = Object.entries(CREDENTIALS).find(
            ([role, account]) => account.userHash === userHashed && account.passHash === passHashed
        );

        if (matchedEntry) {
            const [roleName] = matchedEntry;
            sessionStorage.setItem('vault_auth_user', roleName);
            currentUser = roleName;
            isLoggedIn = true;
            closeLoginModal();
            updateAuthStateUI();
            loadAndRender();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    });

    function toggleVisibility(id) {
        if (!isLoggedIn || currentUser !== 'admin') return;
        const track = vaultTracks.find(t => t.id === id);
        if (track) {
            track.isPublic = !track.isPublic;
            loadAndRender();
        }
    }

    function setFilter(filter) {
        activeFilter = filter;
        updateTabStyles();
        loadAndRender();
    }

    function setSort(sortOption) {
        activeSort = sortOption;
        loadAndRender();
    }

    function updateTabStyles() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${activeFilter}`).classList.add('active');
    }

    function loadAndRender() {
        renderUI(vaultTracks);
    }

    function sortTracks(tracks, sortMode) {
        return [...tracks].sort((a, b) => {
            const titleA = (a.title || '').toLowerCase();
            const titleB = (b.title || '').toLowerCase();
            const dateA = a.trackDate || '';
            const dateB = b.trackDate || '';

            switch (sortMode) {
                case 'name-asc':
                    return titleA.localeCompare(titleB);
                case 'name-desc':
                    return titleB.localeCompare(titleA);
                case 'date-asc':
                    return dateA.localeCompare(dateB) || a.id - b.id;
                case 'date-desc':
                default:
                    return dateB.localeCompare(dateA) || b.id - a.id;
            }
        });
    }

    function renderUI(tracks) {
        const visibleTracks = tracks.filter(t => isLoggedIn || t.isPublic);

        document.getElementById('count-all').textContent = visibleTracks.length;
        document.getElementById('count-public').textContent = tracks.filter(t => t.isPublic).length;
        document.getElementById('count-private').textContent = tracks.filter(t => !t.isPublic).length;

        const filtered = visibleTracks.filter(t => {
            if (activeFilter === 'public') return t.isPublic;
            if (activeFilter === 'private') return !t.isPublic;
            return true;
        });

        const sorted = sortTracks(filtered, activeSort);
        const trackList = document.getElementById('trackList');

        if (sorted.length === 0) {
            trackList.innerHTML = `<div class="empty-state">// NO DATA DETECTED IN THIS INDEX //</div>`;
            return;
        }

        const isAdmin = currentUser === 'admin';

        trackList.innerHTML = sorted.map(track => {
            let coverHtml = `<div class="track-cover-placeholder">// NO_ARTWORK //</div>`;
            if (track.imageSrc) {
                coverHtml = `<img src="${track.imageSrc}" class="track-cover" alt="Cover Art" onerror="this.outerHTML='<div class=\\'track-cover-placeholder\\'>// NO_ARTWORK //</div>';">`;
            }

            const displayDate = track.trackDate ? track.trackDate : "UNKNOWN";

            return `
                <div class="track-card">
                    <div class="cover-wrapper">
                        ${coverHtml}
                    </div>
                    <div class="track-info">
                        <div class="track-header">
                            <div>
                                <div class="track-title">${escapeHtml(track.title)}</div>
                                <div class="track-date">// DATE: ${escapeHtml(displayDate)} //</div>
                            </div>
                            <span class="status-badge ${track.isPublic ? 'badge-public' : 'badge-private'}">
                                <span class="status-indicator"></span>
                                ${track.isPublic ? 'Public' : 'Restricted'}
                            </span>
                        </div>
                        ${track.notes ? `<div class="track-notes">${escapeHtml(track.notes)}</div>` : ''}
                        <audio controls src="${track.audioSrc}"></audio>
                    </div>
                    ${isAdmin ? `
                    <div class="track-actions">
                        <button class="btn" onclick="toggleVisibility(${track.id})">
                            ${track.isPublic ? 'Restrict' : 'Release'}
                        </button>
                    </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
</script>
