<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[the vault]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #050608;
            --panel-bg: #0d1117;
            --panel-border: #2a323d;
            --silver-main: #c0c6ce;
            --silver-bright: #e2e8f0;
            --silver-dim: #64748b;
            --cyan-accent: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.25);
            --amber-accent: #ff9900;
            --amber-glow: rgba(255, 153, 0, 0.25);
            --danger-red: #ff3366;
            --font-head: 'Chakra Petch', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-void);
            color: var(--silver-main);
            font-family: var(--font-mono);
            padding: 2.5rem;
            max-width: 950px;
            margin: 0 auto;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--panel-border);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 120px;
            height: 2px;
            background: var(--cyan-accent);
            box-shadow: 0 0 10px var(--cyan-accent);
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }

        h1 {
            font-family: var(--font-head);
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: var(--silver-bright);
            text-transform: uppercase;
        }

        .user-tag {
            font-size: 0.75rem;
            color: var(--cyan-accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid var(--cyan-accent);
            padding: 0.2rem 0.6rem;
            background: rgba(0, 240, 255, 0.05);
        }

        .header-actions {
            display: flex;
            gap: 0.8rem;
        }

        .btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: var(--silver-bright);
            border: 1px solid var(--silver-dim);
            padding: 0.6rem 1.4rem;
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .btn:hover {
            border-color: var(--cyan-accent);
            color: var(--cyan-accent);
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .btn-cyan {
            border-color: var(--cyan-accent);
            color: var(--cyan-accent);
        }

        .btn-danger {
            border-color: var(--danger-red);
            color: var(--danger-red);
        }

        .btn-danger:hover {
            background: rgba(255, 51, 102, 0.1);
            border-color: var(--danger-red);
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.3);
        }

        .upload-section {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: none;
        }

        .upload-section.active { display: block; }

        .form-group { margin-bottom: 1.2rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--silver-dim);
            text-transform: uppercase;
        }

        input[type="text"], input[type="password"], input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-void);
            border: 1px solid var(--panel-border);
            color: var(--silver-bright);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            outline: none;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--cyan-accent);
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--panel-border);
        }

        .tab {
            padding: 0.6rem 1.2rem;
            background: transparent;
            border: none;
            color: var(--silver-dim);
            font-family: var(--font-head);
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover { color: var(--silver-bright); }

        .tab.active {
            color: var(--cyan-accent);
            border-bottom-color: var(--cyan-accent);
            background: rgba(0, 240, 255, 0.03);
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .track-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 1.2rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1.5rem;
            align-items: center;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .track-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .track-title {
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--silver-bright);
            letter-spacing: 0.5px;
        }

        .status-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.6rem;
            font-family: var(--font-mono);
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .badge-private {
            border-color: var(--amber-accent);
            color: var(--amber-accent);
            background: rgba(255, 153, 0, 0.05);
            box-shadow: 0 0 6px var(--amber-glow);
        }

        .badge-public {
            border-color: var(--cyan-accent);
            color: var(--cyan-accent);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 6px var(--cyan-glow);
        }

        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .badge-private .status-indicator { background: var(--amber-accent); }
        .badge-public .status-indicator { background: var(--cyan-accent); }

        audio {
            width: 100%;
            height: 32px;
            margin-top: 0.4rem;
            filter: invert(0.9) hue-rotate(180deg);
        }

        .track-actions {
            display: flex;
            gap: 0.6rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            border: 1px dashed var(--panel-border);
            color: var(--silver-dim);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 6, 8, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-family: var(--font-head);
            font-size: 1.2rem;
            color: var(--silver-bright);
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        .error-msg {
            color: var(--danger-red);
            font-size: 0.75rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <h1>// vault //</h1>
            <span id="userTag" class="user-tag">// guest //</span>
        </div>
        <div class="header-actions">
            <button id="addTrackBtn" class="btn btn-cyan" onclick="toggleUploadDrawer()" style="display: none;">+ add track</button>
            <button id="authBtn" class="btn" onclick="handleAuthAction()">// login //</button>
        </div>
    </header>

    <section id="uploadDrawer" class="upload-section">
        <form id="trackForm">
            <div class="form-group">
                <label for="title">// track title // identifier //</label>
                <input type="text" id="title" placeholder="e.g., UNIT_02_AUDIO_DEMO" required>
            </div>
            <div class="form-group">
                <label for="audioFile">// audio file //</label>
                <input type="file" id="audioFile" accept="audio/*" required>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.8rem;">
                <button type="button" class="btn" onclick="toggleUploadDrawer()">// cancel //</button>
                <button type="submit" class="btn btn-cyan">// upload //</button>
            </div>
        </form>
    </section>

    <div class="controls">
        <button id="tab-all" class="tab active" onclick="setFilter('all')">// all // (<span id="count-all">0</span>)</button>
        <button id="tab-public" class="tab" onclick="setFilter('public')">// public // (<span id="count-public">0</span>)</button>
        <button id="tab-private" class="tab" onclick="setFilter('private')" style="display: none;">// private // (<span id="count-private">0</span>)</button>
    </div>

    <main id="trackList" class="track-list">
    </main>

    <div id="loginModal" class="modal-overlay">
        <div class="modal">
            <h2 class="modal-title">// AUTHENTICATE //</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">// identifier //</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">// access key //</label>
                    <input type="password" id="password" required>
                </div>
                <div id="loginError" class="error-msg">// ACCESS DENIED //</div>
                <div style="display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem;">
                    <button type="button" class="btn" onclick="closeLoginModal()">// cancel //</button>
                    <button type="submit" class="btn btn-cyan">// verify //</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        
        const CREDENTIALS = {
            userHash: "4c3b3284e206c3db72440736cfdbd185f0e61a3c7fd9f049987196b987d3d1ee",
            passHash: "4107288f0b60f2a3cad009e8164af48d39ba6855a3388e5e6858364e14c2fdff"
        };

        let db;
        let activeFilter = 'all';
        let audioObjectURLs = {};
        let isLoggedIn = sessionStorage.getItem('vault_auth') === 'true';

        const request = indexedDB.open("MusicVaultDB", 1);

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("tracks")) {
                db.createObjectStore("tracks", { keyPath: "id" });
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            updateAuthStateUI();
            loadAndRender();
        };

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function updateAuthStateUI() {
            const userTag = document.getElementById('userTag');
            const authBtn = document.getElementById('authBtn');
            const addTrackBtn = document.getElementById('addTrackBtn');
            const privateTab = document.getElementById('tab-private');

            if (isLoggedIn) {
                userTag.textContent = "// admin: mk //";
                authBtn.textContent = "// logout //";
                addTrackBtn.style.display = "block";
                privateTab.style.display = "block";
            } else {
                userTag.textContent = "// guest //";
                authBtn.textContent = "// login //";
                addTrackBtn.style.display = "none";
                privateTab.style.display = "none";
                if (activeFilter === 'private') {
                    setFilter('all');
                }
            }
        }

        function handleAuthAction() {
            if (isLoggedIn) {
                sessionStorage.removeItem('vault_auth');
                isLoggedIn = false;
                updateAuthStateUI();
                loadAndRender();
            } else {
                document.getElementById('loginModal').classList.add('active');
            }
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;

            const userHashed = await sha256(userVal);
            const passHashed = await sha256(passVal);

            if (userHashed === CREDENTIALS.userHash && passHashed === CREDENTIALS.passHash) {
                sessionStorage.setItem('vault_auth', 'true');
                isLoggedIn = true;
                closeLoginModal();
                updateAuthStateUI();
                loadAndRender();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        function toggleUploadDrawer() {
            document.getElementById('uploadDrawer').classList.toggle('active');
        }

        document.getElementById('trackForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (!isLoggedIn) return;

            const title = document.getElementById('title').value;
            const fileInput = document.getElementById('audioFile');
            const file = fileInput.files[0];

            if (!file) return;

            const newTrack = {
                id: Date.now(),
                title: title,
                fileBlob: file,
                isPublic: false,
                timestamp: new Date().toISOString().split('T')[0]
            };

            const tx = db.transaction("tracks", "readwrite");
            const store = tx.objectStore("tracks");
            store.add(newTrack);

            tx.oncomplete = () => {
                document.getElementById('trackForm').reset();
                toggleUploadDrawer();
                loadAndRender();
            };
        });

        function toggleVisibility(id) {
            if (!isLoggedIn) return;

            const tx = db.transaction("tracks", "readwrite");
            const store = tx.objectStore("tracks");
            const getReq = store.get(id);

            getReq.onsuccess = () => {
                const track = getReq.result;
                if (track) {
                    track.isPublic = !track.isPublic;
                    store.put(track);
                }
            };

            tx.oncomplete = () => {
                loadAndRender();
            };
        }

        function deleteTrack(id) {
            if (!isLoggedIn) return;

            if (confirm("Delete track from vault? This action cannot be undone.")) {
                const tx = db.transaction("tracks", "readwrite");
                const store = tx.objectStore("tracks");
                store.delete(id);

                tx.oncomplete = () => {
                    if (audioObjectURLs[id]) {
                        URL.revokeObjectURL(audioObjectURLs[id]);
                        delete audioObjectURLs[id];
                    }
                    loadAndRender();
                };
            }
        }

        function setFilter(filter) {
            activeFilter = filter;
            updateTabStyles();
            loadAndRender();
        }

        function updateTabStyles() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${activeFilter}`).classList.add('active');
        }

        function loadAndRender() {
            if (!db) return;

            const tx = db.transaction("tracks", "readonly");
            const store = tx.objectStore("tracks");
            const getAllReq = store.getAll();

            getAllReq.onsuccess = () => {
                const tracks = getAllReq.result || [];
                renderUI(tracks);
            };
        }

        function renderUI(tracks) {
            const visibleTracks = tracks.filter(t => isLoggedIn || t.isPublic);

            document.getElementById('count-all').textContent = visibleTracks.length;
            document.getElementById('count-public').textContent = tracks.filter(t => t.isPublic).length;
            document.getElementById('count-private').textContent = tracks.filter(t => !t.isPublic).length;

            const filtered = visibleTracks.filter(t => {
                if (activeFilter === 'public') return t.isPublic;
                if (activeFilter === 'private') return !t.isPublic;
                return true;
            });

            const trackList = document.getElementById('trackList');

            if (filtered.length === 0) {
                trackList.innerHTML = `<div class="empty-state">// NO AUDIO DATA DETECTED IN THIS INDEX //</div>`;
                return;
            }

            trackList.innerHTML = filtered.map(track => {
                if (!audioObjectURLs[track.id]) {
                    audioObjectURLs[track.id] = URL.createObjectURL(track.fileBlob);
                }

                return `
                    <div class="track-card">
                        <div class="track-info">
                            <div class="track-header">
                                <span class="track-title">${escapeHtml(track.title)}</span>
                                <span class="status-badge ${track.isPublic ? 'badge-public' : 'badge-private'}">
                                    <span class="status-indicator"></span>
                                    ${track.isPublic ? 'Public' : 'Restricted'}
                                </span>
                            </div>
                            <audio controls src="${audioObjectURLs[track.id]}"></audio>
                        </div>
                        ${isLoggedIn ? `
                        <div class="track-actions">
                            <button class="btn" onclick="toggleVisibility(${track.id})">
                                ${track.isPublic ? 'Restrict' : 'Release'}
                            </button>
                            <button class="btn btn-danger" onclick="deleteTrack(${track.id})">
                                Purge
                            </button>
                        </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
